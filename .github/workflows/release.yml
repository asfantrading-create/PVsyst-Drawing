name: Build and release

# Push a tag like v1.2.0 to build Windows + Meta Quest and publish a GitHub release.
# Installed applications check the latest release at startup and update themselves.
#
# Required repository secrets (Settings > Secrets and variables > Actions), see docs/RELEASING.md:
#   UNITY_LICENSE   content of the Unity license file (.ulf)   - Unity Personal
#   UNITY_EMAIL     Unity account e-mail
#   UNITY_PASSWORD  Unity account password
#   UNITY_SERIAL    (only for Unity Pro / Plus serial based activation)
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a test build without release (e.g. 0.0.1)"
        required: false
        default: "0.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/core-tests.yml

  build:
    name: Build ${{ matrix.targetPlatform }}
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            artifact: PVDesigner-Windows-x64.zip
          - targetPlatform: Android
            artifact: PVDesigner-Quest.apk
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${{ github.event.inputs.version }}"
          fi
          echo "version=${v:-0.0.0}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: PVDesigner
          buildMethod: PVDesigner.EditorTools.BuildScript.BuildFromCommandLine
          versioning: Custom
          version: ${{ steps.version.outputs.version }}
          androidExportType: androidPackage

      - name: Package Windows build
        if: matrix.targetPlatform == 'StandaloneWindows64'
        shell: bash
        run: |
          sudo chown -R "$(id -u)" build
          cd build/StandaloneWindows64
          rm -rf *_BurstDebugInformation_DoNotShip *_BackUpThisFolder_ButDontShipItWithYourGame
          zip -r -q "../../${{ matrix.artifact }}" .
          cd ../..
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          cat "${{ matrix.artifact }}.sha256"

      - name: Package Quest build
        if: matrix.targetPlatform == 'Android'
        shell: bash
        run: |
          sudo chown -R "$(id -u)" build
          apk=$(find build/Android -name "*.apk" | head -n 1)
          cp "$apk" "${{ matrix.artifact }}"
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          cat "${{ matrix.artifact }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.targetPlatform }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -la dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
