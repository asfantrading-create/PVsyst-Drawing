name: Core tests

# Runs the unit tests of the calculation core (solar geometry, shading, simulation, ...).
# No Unity license is needed: the engine independent sources are compiled with the .NET SDK.
on:
  push:
    branches: ["**"]
    paths:
      - "Assets/PVDesigner/Scripts/Core/**"
      - "Tools/CoreTests/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run tests
        run: dotnet test Tools/CoreTests --configuration Release --logger "console;verbosity=normal"
